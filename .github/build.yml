name: Build RPGClasses

on:
  push:
      branches:
            - main
                  - esking11111-arch-patch-1
                    workflow_dispatch:

                    jobs:
                      build:
                          runs-on: ubuntu-latest

                              steps:
                                    - name: Checkout
                                            uses: actions/checkout@v4

                                                  - name: Setup .NET 9
                                                          uses: actions/setup-dotnet@v4
                                                                  with:
                                                                            dotnet-version: '9.0.x'

                                                                                  - name: Build
                                                                                          run: dotnet build RPGClasses.csproj -c Release

                                                                                                - name: Upload plugin
                                                                                                        uses: actions/upload-artifact@v4
                                                                                                                with:
                                                                                                                          name: RPGClasses
                                                                                                                                    path: bin/Release/net9.0/RPGClasses.dll